<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription — FIFABOT</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="navbar-logo">FIFABOT</a>
    <div class="navbar-links">
      <a href="login.html">Connexion</a>
    </div>
  </nav>

  <main class="main-container">
    <div class="card">
      <h1 class="card-title">Inscription</h1>
      <p class="card-subtitle">Créez votre compte FIFABOT</p>

      <form id="register-form">
        <div class="form-group">
          <label for="full_name">Nom complet</label>
          <input type="text" id="full_name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="password">Mot de passe (min. 6 caractères)</label>
          <input type="password" id="password" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary">Créer mon compte</button>
        <div id="message" class="message"></div>
      </form>

      <p style="margin-top: 16px; text-align: center; font-size: 14px; color: var(--text-secondary);">
        Déjà inscrit ? <a href="login.html" class="link">Se connecter</a>
      </p>
    </div>
  </main>

  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
