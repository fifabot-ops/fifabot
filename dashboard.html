<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tableau de bord — FIFABOT</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header class="app-header">
    <p style="color: var(--text-secondary); font-size: 14px; font-weight: 600; margin-bottom: 4px;">Bonjour,</p>
    <h1 id="user-name-display">Utilisateur <span style="color: var(--accent);">.</span></h1>
  </header>

  <main style="padding: 10px 20px; max-width: 800px; margin: 0 auto; width: 100%;">
    
    <!-- Statut du compte -->
    <div class="card" style="margin-top: 20px; display:flex; flex-direction:column; gap: 16px;">
      <h3 style="font-size: 16px; font-weight: 700;">Statut du compte</h3>
      <div style="display:flex; justify-content:space-between; align-items:center; background: var(--bg-main); padding: 16px; border-radius: 16px;">
        <span style="color: var(--text-secondary); font-size: 14px;">Abonnement</span>
        <span id="sub-status" style="background: #FEF3C7; color: #92400E; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 20px;">Vérification...</span>
      </div>
      <a href="pricing.html" class="btn btn-secondary" style="text-decoration:none; text-align:center;">Passer Premium (1 500 FCFA)</a>
    </div>

    <!-- Accès rapide -->
    <div style="margin: 24px 0;">
      <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">Accès rapide</h2>
      
      <a href="competitions.html" class="btn btn-primary" style="text-decoration:none; display:block; text-align:center; margin-bottom:12px;">
        Nouvelle analyse
      </a>
      
      <a href="history.html" class="btn" style="text-decoration:none; display:block; text-align:center; background: var(--bg-card); color: var(--text-main); box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light); margin-bottom: 12px;">
        Voir mon historique
      </a>

      <!-- Bouton Admin (caché par défaut) -->
      <a href="admin.html" id="admin-link" style="display:none; text-decoration:none; text-align:center; background: var(--text-main); color: white; padding: 16px; border-radius: 16px; font-weight: 700; box-shadow: 0 8px 20px rgba(0,0,0,0.2);">
        Panneau d'administration
      </a>
    </div>

    <p style="color: var(--text-secondary); font-size: 13px; text-align:center;">
      Connecté en tant que : <strong id="user-email-display" style="color: var(--text-main);">...</strong>
    </p>

  </main>

  <!-- BARRE DE NAVIGATION EN BAS -->
  <nav class="app-bottom-nav">
    <a href="dashboard.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Accueil
    </a>
    <a href="competitions.html" class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      Jeux
    </a>
    <a href="history.html" class="nav-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      Historique
    </a>
    <a href="#" id="logout-btn-nav" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      Quitter
    </a>
  </nav>

  <script src="js/supabase-client.js"></script>
  <script>
    (async () => {
      try {
        // 1. Vérifier la connexion
        const { data, error } = await window.supabaseClient.auth.getUser();
        if (!data || !data.user) {
          window.location.href = 'login.html';
          return;
        }
        
        // 2. Afficher les infos de base
        const email = data.user.email;
        const fullName = data.user.user_metadata?.full_name || email.split('@')[0];
        
        document.getElementById('user-email-display').textContent = email;
        document.getElementById('user-name-display').innerHTML = `${fullName} <span style="color: var(--accent);">.</span>`;

        // 3. Vérifier le rôle (Admin ou non)
        const { data: profile, error: profileError } = await window.supabaseClient
          .from('profiles')
          .select('role')
          .eq('id', data.user.id)
          .single();
        
        if (profileError) {
          console.error("Erreur lecture profil:", profileError);
          alert("Erreur de lecture du profil : " + profileError.message + "\nVérifiez les permissions dans Supabase.");
        } else if (profile && profile.role === 'admin') {
          document.getElementById('admin-link').style.display = 'block';
        }

        // 4. Vérifier le statut de l'abonnement
        const { data: payments } = await window.supabaseClient
          .from('payment_requests')
          .select('status')
          .eq('user_id', data.user.id)
          .eq('status', 'approved');

        const statusBadge = document.getElementById('sub-status');
        
        if (payments && payments.length > 0) {
          statusBadge.textContent = 'Premium Actif';
          statusBadge.style.background = '#D1FAE5';
          statusBadge.style.color = '#065F46';
        } else {
          statusBadge.textContent = 'En attente';
          statusBadge.style.background = '#FEF3C7';
          statusBadge.style.color = '#92400E';
        }
      } catch (err) {
        console.error("Erreur critique dashboard:", err);
        alert("Erreur critique : " + err.message);
      }
    })();

    // Gérer la déconnexion
    document.getElementById('logout-btn-nav').addEventListener('click', async (e) => {
      e.preventDefault();
      await window.supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
