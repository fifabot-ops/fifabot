<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Historique — FIFABOT</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header class="app-header">
    <p style="color: var(--text-secondary); font-size: 14px; font-weight: 600; margin-bottom: 4px;">Vos précédentes</p>
    <h1>Analyses <span style="color: var(--accent);">.</span></h1>
  </header>

  <main style="padding: 0 20px; max-width: 800px; margin: 0 auto; width: 100%;">

    <div style="margin: 20px 0;">
      <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">Historique récent</h2>
    </div>

    <!-- Conteneur des analyses -->
    <div id="history-container" style="display:flex; flex-direction:column; gap:16px; padding-bottom: 20px;">
      <p style="color: var(--text-secondary);">Chargement de l'historique...</p>
    </div>

  </main>

  <!-- BARRE DE NAVIGATION EN BAS -->
  <nav class="app-bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Accueil
    </a>
    <a href="competitions.html" class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      Jeux
    </a>
    <a href="history.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      Historique
    </a>
    <a href="#" id="logout-btn-nav" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      Quitter
    </a>
  </nav>

  <script src="js/supabase-client.js"></script>
  <script src="js/history.js"></script>
  <script>
    document.getElementById('logout-btn-nav').addEventListener('click', async (e) => {
      e.preventDefault();
      await window.supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
