<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — FIFABOT</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="navbar-logo">FIFABOT</a>
    <div class="navbar-links">
      <a href="register.html">Inscription</a>
    </div>
  </nav>

  <main class="main-container">
    <div class="card">
      <h1 class="card-title">Connexion</h1>
      <p class="card-subtitle">Accédez à votre espace FIFABOT</p>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary">Se connecter</button>
        <div id="message" class="message"></div>
      </form>

      <p style="margin-top: 16px; text-align: center; font-size: 14px; color: var(--text-secondary);">
        Pas encore de compte ? <a href="register.html" class="link">S'inscrire</a>
      </p>
    </div>
  </main>

  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
